name: docker-review
services:
  app:
    build: ./examples/counter
    image: docker-review-counter:local
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      APP_MESSAGE: Hello from Compose
    volumes:
      - counter-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
  client:
    image: docker-review-counter:local
    profiles: ["tools"]
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-c", "import urllib.request; print(urllib.request.urlopen('http://app:8080/', timeout=3).read().decode())"]
volumes:
  counter-data:
